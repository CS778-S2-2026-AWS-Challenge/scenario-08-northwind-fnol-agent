name: Code work
description: Record a feature, defect, regression, integration gap, or security concern in the repository.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or non-sensitive details only. Do not post credentials, personal claim data,
        private incident records, or exploit instructions in a public issue.

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      description: Choose the primary reason for this repository issue.
      options:
        - Feature
        - Bug
        - Regression validation
        - Integration gap
        - Security concern
        - Maintenance or documentation
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or reason
      description: State the observable problem, risk, or reason this issue is needed.
      placeholder: What is missing, failing, or requiring explicit verification?
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Describe the concrete repository change or verification result expected.
      placeholder: Identify the code, test, documentation, or workflow outcome.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, checkable conditions for closing this issue.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Related issue or PR
      description: Link the existing repository issue or pull request when this is follow-up work. Write None when this is standalone.
      placeholder: "Refs #123, or None - standalone repository work."
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List repository issues, contracts, or inputs that must exist first. Write None when there are no dependencies.
      placeholder: "- #123: documented response fields, or None."
    validations:
      required: true

  - type: textarea
    id: owned-behavior
    attributes:
      label: Owned behavior
      description: Define the behaviour this issue owns. Do not claim adjacent active work.
      placeholder: State the bounded user, system, contract, test, or governance outcome owned here.
    validations:
      required: true

  - type: textarea
    id: impact-area
    attributes:
      label: Expected impact area
      description: List likely modules, paths, or contracts. This is an impact forecast, not a rigid file allowlist.
      placeholder: "For example: backend API and contract tests; docs/api.md when the contract changes."
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: State adjacent work that remains outside this issue.
      placeholder: "For example: no UI redesign and no provider deployment."
    validations:
      required: true

  - type: textarea
    id: shared-contracts
    attributes:
      label: Shared contracts
      description: List affected product, API, persistence, fixture, authority, or workflow contracts. Write None when unaffected.
      placeholder: "docs/api.md and Claim State revision rules, or None."
    validations:
      required: true

  - type: dropdown
    id: risk-class
    attributes:
      label: Risk class
      description: Choose the highest material risk introduced or verified by this issue.
      options:
        - Standard
        - Shared contract
        - Persistence or concurrency
        - External side effect
        - Identity, authority, security, or privacy
        - Repository governance or deployment
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner or responsible contributor
      description: Identify the person responsible for moving this issue forward.
      placeholder: "@username"
    validations:
      required: true
