name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check .

      - name: Type-check backend
        run: python -m mypy backend tests

      - name: Test backend
        run: python -m pytest --cov=backend --cov-report=term-missing

      - name: Check OpenAPI snapshot drift
        run: python scripts/export_openapi.py --check

      - name: Check AuditEvent contract snapshot drift
        run: python scripts/export_audit_contract.py --check

  customer-quality:
    name: Customer quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customer/package-lock.json

      - name: Install customer dependencies
        working-directory: customer
        run: npm ci

      - name: Lint customer
        working-directory: customer
        run: npm run lint

      - name: Test customer
        working-directory: customer
        run: npm test

      - name: Build customer
        working-directory: customer
        run: npm run build

  docs-quality:
    name: Docs quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed markdown files
        id: changed
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Lint changed markdown
        if: steps.changed.outputs.files != ''
        run: |
          printf '%s\n' ${{ steps.changed.outputs.files }} | xargs npx --yes markdownlint-cli2

      - name: Check links in changed markdown
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress ${{ steps.changed.outputs.files }}
          fail: true

      - name: Check docs updated with API changes
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
          if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
            echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
            echo "Update docs/api.md together with the API change (see ci-checks.md in the governance skill)."
            exit 1
          fi
          if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
            echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
            exit 1
          fi
          echo "Path coupling satisfied."
