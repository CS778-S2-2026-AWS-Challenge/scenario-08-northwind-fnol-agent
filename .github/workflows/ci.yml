name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check backend formatting
        run: python -m ruff format --check .

      - name: Lint backend
        run: python -m ruff check .

      - name: Type-check backend
        run: python -m mypy backend tests

      - name: Test backend
        run: python -m pytest --cov=backend --cov-report=term-missing

  customer-quality:
    name: Customer quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customer/package-lock.json

      - name: Install customer dependencies
        working-directory: customer
        run: npm ci

      - name: Lint customer
        working-directory: customer
        run: npm run lint

      - name: Build customer
        working-directory: customer
        run: npm run build
