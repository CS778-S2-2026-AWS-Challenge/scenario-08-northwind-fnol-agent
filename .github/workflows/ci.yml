name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-impact:
    name: Select frontend impact
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.impact.outputs.customer }}
      workbench: ${{ steps.impact.outputs.workbench }}
      admin: ${{ steps.impact.outputs.admin }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed frontend packages
        id: impact
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base=$(git rev-parse HEAD^)
            fi
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          has_shared=false
          if printf '%s\n' "$changed" | grep -qE '^frontend/shared/'; then has_shared=true; fi
          for package in customer workbench admin; do
            value=false
            if [ "$has_shared" = true ] || printf '%s\n' "$changed" | grep -qE "^${package}/"; then value=true; fi
            echo "$package=$value" >> "$GITHUB_OUTPUT"
          done

  backend-quality:
    name: Backend quality
    # Set repository variable NORTHWIND_CI_RUNNER to northwind-ci after the
    # trusted self-hosted runner is installed. Fork pull requests stay hosted.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.NORTHWIND_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select backend impact
        id: impact
        run: |
          git fetch origin main
          echo "mode=$(python3 scripts/select_backend_tests.py --mode)" >> "$GITHUB_OUTPUT"
          echo "openapi=$(python3 scripts/select_backend_tests.py --needs-openapi)" >> "$GITHUB_OUTPUT"
          echo "audit=$(python3 scripts/select_backend_tests.py --needs-audit-contract)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.impact.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        if: steps.impact.outputs.mode != 'skip'
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check backend formatting
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m ruff format --check .
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check
          fi

      - name: Lint backend
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m ruff check .
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m ruff check
          fi

      - name: Type-check backend
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m mypy backend tests
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m mypy
          fi

      - name: Test backend
        run: |
          mode="${{ steps.impact.outputs.mode }}"
          case "$mode" in
            full)
              python -m pytest --cov=backend --cov-report=term-missing --cov-report=json:coverage.json tests
              python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
              ;;
            scoped)
              python -m pytest --cov=backend --cov-report=json:coverage.json --cov-fail-under=0 $(python scripts/select_backend_tests.py --tests)
              python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
              ;;
            skip)
              echo "No backend behavior changed; backend pytest skipped."
              ;;
            *)
              echo "Unknown backend test selection mode: $mode"
              exit 1
              ;;
          esac

      - name: Check OpenAPI snapshot drift
        if: steps.impact.outputs.openapi == 'true'
        run: python scripts/export_openapi.py --check

      - name: Check AuditEvent contract snapshot drift
        if: steps.impact.outputs.audit == 'true'
        run: python scripts/export_audit_contract.py --check

  customer-quality:
    name: Customer quality
    needs: frontend-impact
    if: needs.frontend-impact.outputs.customer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: customer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: customer/package-lock.json
      - name: Install customer dependencies
        run: npm ci
      - name: Lint customer
        run: npm run lint
      - name: Test customer
        run: npm test
      - name: Build customer
        run: npm run build

  workbench-quality:
    name: Workbench quality
    needs: frontend-impact
    if: needs.frontend-impact.outputs.workbench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workbench
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - name: Install workbench dependencies
        run: npm ci
      - name: Lint workbench
        run: npm run lint
      - name: Test workbench
        run: npm test
      - name: Build workbench
        run: npm run build

  admin-quality:
    name: Admin quality
    needs: frontend-impact
    if: needs.frontend-impact.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        run: npm ci
      - name: Lint admin
        run: npm run lint
      - name: Test admin
        run: npm test
      - name: Build admin
        run: npm run build

  docs-quality:
    name: Docs quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed markdown files
        id: changed
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Lint changed markdown
        if: steps.changed.outputs.files != ''
        run: |
          printf '%s\n' ${{ steps.changed.outputs.files }} | xargs npx --yes markdownlint-cli2

      - name: Check links in changed markdown
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress ${{ steps.changed.outputs.files }}
          fail: true

      - name: Check docs updated with API changes
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
          if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
            echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
            echo "Update docs/api.md together with the API change (see ci-checks.md in the governance skill)."
            exit 1
          fi
          if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
            echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
            exit 1
          fi
          echo "Path coupling satisfied."
