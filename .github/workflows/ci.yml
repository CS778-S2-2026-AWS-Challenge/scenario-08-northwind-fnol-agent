name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select backend impact
        id: impact
        run: |
          git fetch origin main
          echo "mode=$(python3 scripts/select_backend_tests.py --mode)" >> "$GITHUB_OUTPUT"
          echo "openapi=$(python3 scripts/select_backend_tests.py --needs-openapi)" >> "$GITHUB_OUTPUT"
          echo "audit=$(python3 scripts/select_backend_tests.py --needs-audit-contract)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.impact.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        if: steps.impact.outputs.mode != 'skip'
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Check backend formatting
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m ruff format --check .
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check
          fi

      - name: Lint backend
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m ruff check .
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m ruff check
          fi

      - name: Type-check backend
        if: steps.impact.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.impact.outputs.mode }}" = "full" ]; then
            python -m mypy backend tests
          else
            python3 scripts/select_backend_tests.py --python-files | xargs -r python -m mypy
          fi

      - name: Test backend
        run: |
          mode="${{ steps.impact.outputs.mode }}"
          case "$mode" in
            full)
              python -m pytest --cov=backend --cov-report=term-missing --cov-report=json:coverage.json tests
              python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
              ;;
            scoped)
              python -m pytest --cov=backend --cov-report=json:coverage.json --cov-fail-under=0 $(python scripts/select_backend_tests.py --tests)
              python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
              ;;
            skip)
              echo "No backend behavior changed; backend pytest skipped."
              ;;
            *)
              echo "Unknown backend test selection mode: $mode"
              exit 1
              ;;
          esac

      - name: Check OpenAPI snapshot drift
        if: steps.impact.outputs.openapi == 'true'
        run: python scripts/export_openapi.py --check

      - name: Check AuditEvent contract snapshot drift
        if: steps.impact.outputs.audit == 'true'
        run: python scripts/export_audit_contract.py --check

  docs-quality:
    name: Docs quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed markdown files
        id: changed
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Lint changed markdown
        if: steps.changed.outputs.files != ''
        run: |
          printf '%s\n' ${{ steps.changed.outputs.files }} | xargs npx --yes markdownlint-cli2

      - name: Check links in changed markdown
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress ${{ steps.changed.outputs.files }}
          fail: true

      - name: Check docs updated with API changes
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
          if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
            echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
            echo "Update docs/api.md together with the API change (see ci-checks.md in the governance skill)."
            exit 1
          fi
          if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
            echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
            exit 1
          fi
          echo "Path coupling satisfied."
