name: Documentation quality

on:
  pull_request:
    paths:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "SPEC/**"
      - "sprint/**"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-quality:
    name: Docs quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select changed markdown files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Lint changed markdown
        if: steps.changed.outputs.files != ''
        run: |
          printf '%s\n' ${{ steps.changed.outputs.files }} | xargs npx --yes markdownlint-cli2

      - name: Check links in changed markdown
        if: steps.changed.outputs.files != ''
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress ${{ steps.changed.outputs.files }}
          fail: true

      - name: Check docs updated with API changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          fi
          changed=$(git diff --name-only "$base" HEAD)
          modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
          if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
            echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
            echo "Update docs/api.md together with the API change (see ci-checks.md in the governance skill)."
            exit 1
          fi
          if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
            echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
            exit 1
          fi
          echo "Path coupling satisfied."
