name: PR705 contract reconciliation

on:
  push:
    branches:
      - feature/issue-629-incomplete-claim-recovery

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase API prose on current main and reapply P17-only documentation delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          validated_p17=f56cdcaddc4c5bb751c75a1a92047097072f589c
          old_base=$(git merge-base "$validated_p17" origin/main)
          git diff --binary "$old_base" "$validated_p17" -- docs/api.md > /tmp/p17-api.patch
          git checkout origin/main -- docs/api.md
          if [ -s /tmp/p17-api.patch ]; then
            git apply --3way /tmp/p17-api.patch
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Regenerate OpenAPI from reconciled application
        run: python scripts/export_openapi.py

      - name: Validate reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check backend tests
          python -m ruff check backend tests
          python -m mypy backend tests
          python -m pytest \
            tests/test_handoff_queue_fixtures.py \
            tests/test_incomplete_claim_recovery.py \
            tests/test_incomplete_claim_recovery_concurrency.py \
            tests/test_incomplete_claim_recovery_edges.py \
            tests/test_incomplete_claim_recovery_late_review.py \
            tests/test_incomplete_claim_recovery_review.py
          python scripts/export_openapi.py --check

      - name: Commit reconciled generated contracts and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr705_reconcile.yml
          git add docs/api.md docs/openapi.snapshot.json tests/test_handoff_queue_fixtures.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No reconciliation changes required."
            exit 0
          fi
          git commit -m "fix(backend): synchronize recovery contracts after main merge"
          git push origin "HEAD:feature/issue-629-incomplete-claim-recovery"
