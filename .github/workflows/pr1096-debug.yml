name: PR1096 backend static debug

on:
  push:
    branches:
      - feature/issue-1076-unified-recovery

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Show selected Python files
        run: python scripts/select_backend_tests.py --python-files
      - name: Ruff format
        run: python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check
      - name: Ruff lint
        run: python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff check
      - name: Mypy
        run: python scripts/select_backend_tests.py --python-files | xargs -r python -m mypy
