services:
  mongodb:
    image: mongo:8.0.12
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - northwind-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-init:
    image: mongo:8.0.12
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./deploy/local/init-mongodb.sh:/usr/local/bin/init-mongodb.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/init-mongodb.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - northwind-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set northwind http://minio:9000
        "$${NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}"
        "$${NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}" &&
        mc mb --ignore-existing northwind/northwind-evidence &&
        mc mb --ignore-existing northwind/northwind-knowledge
    environment:
      NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID: ${NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    restart: "no"

  knowledge-init:
    profiles: ["vp"]
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      NORTHWIND_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID: ${NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      NORTHWIND_OBJECT_STORAGE_REGION: ${NORTHWIND_OBJECT_STORAGE_REGION:-us-east-1}
      NORTHWIND_KNOWLEDGE_BUCKET: northwind-knowledge
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python scripts/upload_knowledge_sources.py config/knowledge-source-corpus &&
        for request in config/knowledge-ingestion-requests/*.json;
        do python scripts/ingest_knowledge_source.py "$${request}" || exit 1; done
    restart: "no"

  backend:
    profiles: ["vp"]
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      knowledge-init:
        condition: service_completed_successfully
    environment:
      NORTHWIND_ENVIRONMENT: development
      NORTHWIND_IDENTITY_MODE: normal
      NORTHWIND_IDENTITY_DB_PATH: /var/lib/northwind/claimant-identity.sqlite3
      NORTHWIND_STAFF_IDENTITY_DB_PATH: /var/lib/northwind/staff-identity.sqlite3
      NORTHWIND_CONTROL_PLANE_DB_PATH: /var/lib/northwind/control-plane.sqlite3
      NORTHWIND_STAFF_BOOTSTRAP_EMAIL: ${NORTHWIND_STAFF_BOOTSTRAP_EMAIL:-}
      NORTHWIND_STAFF_BOOTSTRAP_PASSWORD: ${NORTHWIND_STAFF_BOOTSTRAP_PASSWORD:-}
      NORTHWIND_STAFF_BOOTSTRAP_DISPLAY_NAME: ${NORTHWIND_STAFF_BOOTSTRAP_DISPLAY_NAME:-Northwind Claims Professional}
      DATA_RUNTIME_PROFILE: local_mvp
      NORTHWIND_MONGODB_URI: mongodb://mongodb:27017/?directConnection=true&replicaSet=rs0
      NORTHWIND_MONGODB_DATABASE: northwind_fnol
      NORTHWIND_MONGODB_COLLECTION: northwind_records
      NORTHWIND_MONGODB_SERVER_SELECTION_TIMEOUT_MS: 5000
      NORTHWIND_OBJECT_STORAGE_ADAPTER: s3_compatible
      NORTHWIND_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      NORTHWIND_OBJECT_STORAGE_PRESIGN_ENDPOINT: ${NORTHWIND_OBJECT_STORAGE_PRESIGN_ENDPOINT:-}
      NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID: ${NORTHWIND_OBJECT_STORAGE_ACCESS_KEY_ID:-minioadmin}
      NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${NORTHWIND_OBJECT_STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      NORTHWIND_OBJECT_STORAGE_BUCKET: northwind-evidence
      NORTHWIND_KNOWLEDGE_BUCKET: northwind-knowledge
      NORTHWIND_OBJECT_STORAGE_REGION: ${NORTHWIND_OBJECT_STORAGE_REGION:-us-east-1}
      NORTHWIND_OBJECT_STORAGE_PRESIGN_EXPIRY_SECONDS: 900
      NORTHWIND_CORS_ALLOW_ORIGINS: ${NORTHWIND_CORS_ALLOW_ORIGINS:-*}
      NORTHWIND_CORS_ALLOW_CREDENTIALS: "false"
      AGENT_RUNTIME_PROFILE: ${AGENT_RUNTIME_PROFILE:-controlled}
      MODEL_PROFILE_ID: ${MODEL_PROFILE_ID:-qwen-local}
      MODEL_RUNTIME_BINDINGS_PATH: /app/config/model-runtime-bindings.json
      NORTHWIND_QWEN_BASE_URL: ${NORTHWIND_QWEN_BASE_URL:-}
      NORTHWIND_MODEL_API_KEY: ${NORTHWIND_MODEL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - northwind-backend-state:/var/lib/northwind
    restart: unless-stopped

volumes:
  northwind-backend-state:
  northwind-minio-data:
  northwind-mongodb-data:
