version: 2.1

jobs:
  backend-quality:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select backend impact
          command: |
            git fetch origin main
            echo "export BACKEND_QUALITY_MODE=$(python scripts/select_backend_tests.py --mode)" >> "$BASH_ENV"
            echo "export BACKEND_QUALITY_OPENAPI=$(python scripts/select_backend_tests.py --needs-openapi)" >> "$BASH_ENV"
            echo "export BACKEND_QUALITY_AUDIT=$(python scripts/select_backend_tests.py --needs-audit-contract)" >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
      - run:
          name: Install backend dependencies
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then
              echo "No backend behavior changed; Python dependencies skipped."
              exit 0
            fi
            python -m pip install -r backend/requirements-dev.txt
      - save_cache:
          key: v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check backend formatting
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            if [ "$BACKEND_QUALITY_MODE" = "full" ]; then
              python -m ruff format --check .
            else
              python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check
            fi
      - run:
          name: Lint backend
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            if [ "$BACKEND_QUALITY_MODE" = "full" ]; then
              python -m ruff check .
            else
              python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff check
            fi
      - run:
          name: Type-check backend
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            if [ "$BACKEND_QUALITY_MODE" = "full" ]; then
              python -m mypy backend tests
            else
              python scripts/select_backend_tests.py --python-files | xargs -r python -m mypy
            fi
      - run:
          name: Test backend
          command: |
            mode="$BACKEND_QUALITY_MODE"
            case "$mode" in
              full)
                python -m pytest --cov=backend --cov-report=term-missing --cov-report=json:coverage.json tests
                python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
                ;;
              scoped)
                python -m pytest --cov=backend --cov-report=json:coverage.json --cov-fail-under=0 $(python scripts/select_backend_tests.py --tests)
                python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
                ;;
              skip)
                echo "No backend behavior changed; backend pytest skipped."
                ;;
              *)
                echo "Unknown backend test selection mode: $mode"
                exit 1
                ;;
            esac
      - run:
          name: Check OpenAPI snapshot drift
          command: |
            if [ "$BACKEND_QUALITY_OPENAPI" = "true" ]; then
              python scripts/export_openapi.py --check
            else
              echo "OpenAPI contract unaffected; check skipped."
            fi
      - run:
          name: Check AuditEvent contract snapshot drift
          command: |
            if [ "$BACKEND_QUALITY_AUDIT" = "true" ]; then
              python scripts/export_audit_contract.py --check
            else
              echo "AuditEvent contract unaffected; check skipped."
            fi

  github-automation-quality:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-automation-node-{{ arch }}-{{ checksum "automation/github-automation/package-lock.json" }}
      - run:
          name: Install GitHub automation dependencies
          command: npm ci
          working_directory: automation/github-automation
      - save_cache:
          key: v1-automation-node-{{ arch }}-{{ checksum "automation/github-automation/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Check GitHub automation Worker
          command: npm run check
          working_directory: automation/github-automation
      - run:
          name: Validate Worker bundle
          command: npm run dry-run
          working_directory: automation/github-automation

  pr-policy:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test repository policy validators
          command: >-
            node --test
            .github/scripts/pr_policy.test.cjs
            .github/scripts/issue_policy.test.cjs
            .github/scripts/review_policy.test.cjs
            .github/scripts/governance_audit.test.cjs
            .circleci/run-pr-policy.test.cjs
      - run:
          name: Validate commit message format
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "No associated pull request; skipping commit format check."
              exit 0
            fi
            bash .github/scripts/check_commit_format.sh \
              "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              "${CIRCLE_PULL_REQUEST##*/}"
      - run:
          name: Validate pull request
          command: node .circleci/run-pr-policy.cjs

  docs-quality:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Lint changed markdown
          command: |
            git fetch origin main
            base=$(git merge-base origin/main HEAD)
            files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
            if [ -z "${files// /}" ]; then
              echo "No markdown changes."
              exit 0
            fi
            printf '%s\n' $files | xargs npx --yes markdownlint-cli2
      - run:
          name: Check docs updated with API changes
          command: |
            git fetch origin main
            base=$(git merge-base origin/main HEAD)
            changed=$(git diff --name-only "$base" HEAD)
            modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
            if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
              echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
              exit 1
            fi
            if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
              echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
              exit 1
            fi
            echo "Path coupling satisfied."

  pr705-reconcile:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch current main
          command: git fetch origin main
      - restore_cache:
          keys:
            - v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
      - run:
          name: Install backend dependencies
          command: python -m pip install -r backend/requirements-dev.txt
      - save_cache:
          key: v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Restore current API contract prose and apply P17 recovery delta
          command: |
            git checkout origin/main -- docs/api.md
            python - <<'PY'
            from pathlib import Path

            path = Path('docs/api.md')
            text = path.read_text(encoding='utf-8')

            old = """When a claimant resumes an existing working claim, the server starts a new interaction session using the current claim state and bounded resume context. A previously paused session MAY be closed when the new session is created.

Only one active claimant session per claim is permitted.

Messages MUST NOT be accepted for a closed session."""
            new = """`POST /api/v1/claims/{claim_id}/sessions/{session_id}/pause` is the explicit P17.1 interruption boundary. It requires the current Claim revision through `If-Match` plus an `Idempotency-Key`, atomically marks the current session `paused`, aligns that Session's recovery snapshot to the accepted Claim revision, clears the Claim's active-session pointer, stores bounded recovery context, and creates exactly one open Claim-scoped recovery Follow-up for the `resume_incomplete_claim` purpose. The accepted Claim revision is part of the idempotency fingerprint, so reusing the same key with a different `If-Match` value returns `409 IDEMPOTENCY_CONFLICT`. It does not create a second Claim State, send a follow-up, make an abandonment decision, or apply a retention transition.

The recovery Follow-up persists purpose, source references, responsible party, channel, due time, status, attempt count, and a contact-permission condition. An authenticated claimant may receive a `pending` in-app recovery Follow-up; that record does not authorise email, SMS, or phone contact. An anonymous browser claimant has no durable authorised contact channel in P17.1, so the record is persisted as `blocked` with `contact_permission=not_authorised`, no channel, and no due time. P17.2 owns any later scheduling, delivery, attempt, or escalation policy.

After that checkpoint, claimant Claim detail and Claim list projections may include `incomplete_context` containing the interruption time, last meaningful activity, bounded resume point, and the claimant-safe open Follow-up state. Pause is accepted only when the authoritative Claim is not `created` and `customer_next_step.can_resume=true`; terminal or explicitly non-resumable Claims return `409 INVALID_STATE_TRANSITION`. Claimant and Workbench projections use the same incomplete predicate: an eligible resumable non-terminal Claim, no authoritative active Session, a relevant paused recovery checkpoint, and an open recovery Follow-up. This applies to every resumable non-terminal workflow state, not only `collecting`. The persisted checkpoint also records the exact durable source reference for the latest qualifying claimant message or accepted claimant business action.

When a claimant resumes an existing working claim, the server starts a new interaction session using the current Claim State and bounded resume context and atomically marks the open recovery Follow-up `resolved`. A later interruption of that resumed Session may create the next recovery Follow-up for the same purpose because only one open Claim+purpose record is allowed at a time.

Only one active claimant session per claim is permitted.

Messages MUST NOT be accepted for a closed or paused session."""
            if old not in text:
                raise SystemExit('session lifecycle anchor not found')
            text = text.replace(old, new, 1)

            row = "| `POST` | `/claims/{claim_id}/sessions` | Start or resume a session |\n"
            pause_row = "| `POST` | `/claims/{claim_id}/sessions/{session_id}/pause` | Persist an interruption checkpoint and initial follow-up task; requires `If-Match` and `Idempotency-Key` |\n"
            if row not in text:
                raise SystemExit('endpoint catalogue anchor not found')
            text = text.replace(row, row + pause_row, 1)

            old_incomplete = """`incomplete_claims` contains Claims in the existing collecting/incomplete queue. It does not
represent or infer a triage status."""
            new_incomplete = """`incomplete_claims` contains resumable non-terminal Claims with no authoritative active Session,
a relevant durable paused recovery checkpoint, and an open recovery Follow-up. It is an operational
overlay rather than an active lifecycle queue and does not infer a triage status."""
            if old_incomplete not in text:
                raise SystemExit('incomplete view anchor not found')
            text = text.replace(old_incomplete, new_incomplete, 1)

            path.write_text(text, encoding='utf-8')
            PY
      - run:
          name: Regenerate OpenAPI from current application
          command: python scripts/export_openapi.py
      - run:
          name: Validate recovery reconciliation
          command: |
            python -m ruff format --check backend tests
            python -m ruff check backend tests
            python -m mypy backend tests
            python -m pytest \
              tests/test_handoff_queue_fixtures.py \
              tests/test_incomplete_claim_recovery.py \
              tests/test_incomplete_claim_recovery_concurrency.py \
              tests/test_incomplete_claim_recovery_edges.py \
              tests/test_incomplete_claim_recovery_late_review.py \
              tests/test_incomplete_claim_recovery_review.py
            python scripts/export_openapi.py --check
      - run:
          name: Commit reconciled contracts back to PR branch
          command: |
            set -euo pipefail
            git rm -f .github/workflows/pr705_reconcile.yml || true
            git checkout origin/main -- .circleci/config.yml
            git add docs/api.md docs/openapi.snapshot.json tests/test_handoff_queue_fixtures.py .circleci/config.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if git diff --cached --quiet; then
              echo "No reconciliation changes required."
              exit 0
            fi
            git commit -m "fix(backend): reconcile recovery contracts after main merge"
            token="${GH_TOKEN:-${GITHUB_TOKEN:-}}"
            if [ -n "$token" ]; then
              git remote set-url origin "https://x-access-token:${token}@github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            fi
            git push origin "HEAD:feature/issue-629-incomplete-claim-recovery"

workflows:
  quality:
    jobs:
      - backend-quality
      - github-automation-quality
      - pr-policy
      - docs-quality
      - pr705-reconcile:
          filters:
            branches:
              only: feature/issue-629-incomplete-claim-recovery
