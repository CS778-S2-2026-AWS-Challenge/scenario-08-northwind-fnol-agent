version: 2.1

# CircleCI redundant-workflow cancellation is a project setting/API capability;
# this config keeps jobs impact-scoped and does not claim to enable that setting.

jobs:
  backend-quality:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select backend impact
          command: |
            git fetch origin main
            echo "export BACKEND_QUALITY_MODE=$(python scripts/select_backend_tests.py --mode)" >> "$BASH_ENV"
            echo "export BACKEND_QUALITY_OPENAPI=$(python scripts/select_backend_tests.py --needs-openapi)" >> "$BASH_ENV"
            echo "export BACKEND_QUALITY_AUDIT=$(python scripts/select_backend_tests.py --needs-audit-contract)" >> "$BASH_ENV"
      - restore_cache:
          keys:
            - v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
      - run:
          name: Install backend dependencies
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then
              echo "No backend behavior changed; Python dependencies skipped."
              exit 0
            fi
            python -m pip install -r backend/requirements-dev.txt
      - save_cache:
          key: v1-python-{{ arch }}-{{ checksum "backend/requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check backend formatting
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check
      - run:
          name: Lint backend
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff check
      - run:
          name: Type-check backend
          command: |
            if [ "$BACKEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            python scripts/select_backend_tests.py --python-files | xargs -r python -m mypy
      - run:
          name: Test backend
          command: |
            mode="$BACKEND_QUALITY_MODE"
            case "$mode" in
              scoped)
                python -m pytest --cov=backend --cov-report=json:coverage.json --cov-fail-under=0 $(python scripts/select_backend_tests.py --tests)
                python scripts/check_diff_coverage.py --coverage coverage.json --base origin/main --min 85
                ;;
              skip)
                echo "No backend behavior changed; backend pytest skipped."
                ;;
              *)
                echo "Unknown backend test selection mode: $mode"
                exit 1
                ;;
            esac
      - run:
          name: Check OpenAPI snapshot drift
          command: |
            if [ "$BACKEND_QUALITY_OPENAPI" = "true" ]; then
              python scripts/export_openapi.py --check
            else
              echo "OpenAPI contract unaffected; check skipped."
            fi
      - run:
          name: Check AuditEvent contract snapshot drift
          command: |
            if [ "$BACKEND_QUALITY_AUDIT" = "true" ]; then
              python scripts/export_audit_contract.py --check
            else
              echo "AuditEvent contract unaffected; check skipped."
            fi

  debug-ruff-format:
