      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Prepare backend static check
          command: |
            git fetch origin main
            python -m pip install -r backend/requirements-dev.txt
      - run:
          name: Ruff format only
          command: python scripts/select_backend_tests.py --python-files | xargs -r python -m ruff format --check

