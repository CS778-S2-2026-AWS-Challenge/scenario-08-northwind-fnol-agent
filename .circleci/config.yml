version: 2.1
setup: true

orbs:
  path-filtering: circleci/path-filtering@3.0.0

workflows:
  setup:
    jobs:
      - path-filtering/filter:
          base-revision: main
          config-path: .circleci/continue_config.yml
          mapping: |
            ^backend/.* backend_changed true
            ^tests/(?!test_backend_(test_selection|quality_profiles)\.py$).* backend_changed true
            ^scripts/(check_diff_coverage|export_openapi|export_audit_contract)\.py$ backend_changed true
            ^scripts/select_backend_tests\.py$ ci_changed true
            ^pyproject\.toml$ backend_changed true
            ^backend/requirements-dev\.txt$ backend_changed true
            ^docs/(openapi\.snapshot\.json|contracts/audit-event\.schema\.json)$ backend_changed true
            ^automation/github-automation/.* automation_changed true
            ^\.circleci/.* ci_changed true
            ^\.github/workflows/.* ci_changed true
            ^docs/.* docs_changed true
            ^.*\.md$ docs_changed true
            ^SPEC/.* docs_changed true
            ^sprint/.* docs_changed true
