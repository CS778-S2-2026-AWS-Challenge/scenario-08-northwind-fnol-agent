      - run:
          name: Apply exact Ruff formatting
          command: |
            python -m pip install ruff==0.11.2
            python -m ruff format               backend/repositories/fixture.py               backend/repositories/mongodb.py               tests/test_retention_execution.py
            if git diff --quiet --               backend/repositories/fixture.py               backend/repositories/mongodb.py               tests/test_retention_execution.py; then
              echo "No formatting diff."
              exit 0
            fi
            git config user.name "jxu316-arch"
            git config user.email "jxu316@aucklanduni.ac.nz"
            git add               backend/repositories/fixture.py               backend/repositories/mongodb.py               tests/test_retention_execution.py
            git commit -m "fix: apply backend recovery formatting"
            git push origin HEAD:feature/issue-1076-unified-recovery

  customer-quality:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select customer impact
          command: |
            git fetch origin main
            if [ "${CIRCLE_BRANCH:-}" = "main" ] || git diff --name-only origin/main...HEAD | grep -qE '^(customer/|frontend/shared/)'; then
              echo "export FRONTEND_QUALITY_MODE=run" >> "$BASH_ENV"
            else
              echo "export FRONTEND_QUALITY_MODE=skip" >> "$BASH_ENV"
            fi
      - restore_cache:
          keys:
            - v1-customer-node-{{ arch }}-{{ checksum "customer/package-lock.json" }}
      - run:
          name: Install customer dependencies
          working_directory: customer
          command: |
            if [ "$FRONTEND_QUALITY_MODE" = "skip" ]; then
              echo "Customer unchanged; frontend quality gate skipped."
              exit 0
            fi
            npm ci
      - save_cache:
          key: v1-customer-node-{{ arch }}-{{ checksum "customer/package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Lint customer
          working_directory: customer
          command: |
            if [ "$FRONTEND_QUALITY_MODE" = "skip" ]; then exit 0; fi
            npm run lint
      - run:
