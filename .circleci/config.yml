version: 2.1

# Setup pipeline: decide which quality workflows this change needs before any of them
# starts, then continue with .circleci/continue_config.yml. A job that is not needed is
# never created. The decision rules live in scripts/ci_plan.py.
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

parameters:
  nightly:
    type: boolean
    default: false
    description: Set by the daily schedule to run the full backend suite.

jobs:
  plan:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Decide which quality jobs to create
          command: |
            git fetch origin main
            python -m scripts.ci_plan \
              --branch "${CIRCLE_BRANCH}" \
              --scheduled << pipeline.parameters.nightly >> \
              --out /tmp/continue-parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue_config.yml
          parameters: /tmp/continue-parameters.json

workflows:
  setup:
    jobs:
      - plan
