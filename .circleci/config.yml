          command: npm run check
          working_directory: automation/github-automation
      - run:
          name: Validate Worker bundle
          command: npm run dry-run
          working_directory: automation/github-automation

  pr-policy:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test repository policy validators
          command: >-
            node --test
            .github/scripts/pr_policy.test.cjs
            .github/scripts/issue_policy.test.cjs
            .github/scripts/review_policy.test.cjs
            .github/scripts/governance_audit.test.cjs
            .circleci/run-pr-policy.test.cjs
      - run:
          name: Validate commit message format
          command: |
            if [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              echo "No associated pull request; skipping commit format check."
              exit 0
            fi
            bash .github/scripts/check_commit_format.sh \
              "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              "${CIRCLE_PULL_REQUEST##*/}"
      - run:
          name: Validate pull request
          command: node .circleci/run-pr-policy.cjs

  docs-quality:
    docker:
      - image: cimg/node:22.14
    resource_class: small
    steps:
      - checkout
      - run:
          name: Lint changed markdown
          command: |
            git fetch origin main
            base=$(git merge-base origin/main HEAD)
            files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md' | tr '\n' ' ')
            if [ -z "${files// /}" ]; then
              echo "No markdown changes."
              exit 0
            fi
            printf '%s\n' $files | xargs npx --yes markdownlint-cli2
      - run:
          name: Check docs updated with API changes
          command: |
            git fetch origin main
            base=$(git merge-base origin/main HEAD)
            changed=$(git diff --name-only "$base" HEAD)
            modified=$(git diff --name-only --diff-filter=M "$base" HEAD)
            if echo "$modified" | grep -qx 'docs/openapi.snapshot.json' && ! echo "$changed" | grep -qx 'docs/api.md'; then
              echo "The OpenAPI snapshot changed but docs/api.md was not updated in the same PR."
              exit 1
            fi
            if echo "$modified" | grep -qx 'docs/contracts/audit-event.schema.json' && ! echo "$changed" | grep -qx 'docs/persistence-schema.md'; then
              echo "The AuditEvent snapshot changed but docs/persistence-schema.md was not updated in the same PR."
              exit 1
            fi
            echo "Path coupling satisfied."

  p12-browser-evidence:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - run:
          name: Select browser-evidence impact
          command: |
            git fetch origin main
            mkdir -p browser-evidence
            if [ "${CIRCLE_BRANCH:-}" = "main" ] || git diff --name-only origin/main...HEAD | grep -qE '^(customer/|workbench/|backend/api/realtime.py|backend/api/workbench|backend/services/|tests/browser/|\.circleci/config\.yml$)'; then
              echo "export BROWSER_EVIDENCE_MODE=run" >> "$BASH_ENV"
            else
              echo "export BROWSER_EVIDENCE_MODE=skip" >> "$BASH_ENV"
              echo "Browser evidence unaffected; job skipped." > browser-evidence/skip.txt
            fi
      - run:
          name: Install browser-evidence dependencies
          command: |
            if [ "$BROWSER_EVIDENCE_MODE" = "skip" ]; then exit 0; fi
            python -m pip install -r backend/requirements-dev.txt
            npm ci --prefix customer
            npm ci --prefix workbench
            npm install --prefix /tmp/p12-playwright --no-save playwright@1.55.0
            /tmp/p12-playwright/node_modules/.bin/playwright install --with-deps chromium
      - run:
          name: Execute claimant ↔ Workbench interruption and recovery journey
          no_output_timeout: 10m
          command: |
            if [ "$BROWSER_EVIDENCE_MODE" = "skip" ]; then exit 0; fi
            set -euo pipefail

            export PR_HEAD_SHA="$CIRCLE_SHA1"
            export BROWSER_EVIDENCE_DIR=browser-evidence
            export NORTHWIND_ENVIRONMENT=test
            export NORTHWIND_IDENTITY_MODE=developer
            export DATA_RUNTIME_PROFILE=fixture
            export AGENT_RUNTIME_PROFILE=controlled
            export NODE_PATH=/tmp/p12-playwright/node_modules

            python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > browser-evidence/backend.log 2>&1 &
            BACKEND_PID=$!
            npm run dev --prefix customer -- --host 127.0.0.1 --port 8001 > browser-evidence/customer.log 2>&1 &
            CUSTOMER_PID=$!
            npm run dev --prefix workbench -- --host 127.0.0.1 --port 8002 > browser-evidence/workbench.log 2>&1 &
            WORKBENCH_PID=$!

            cleanup() {
              kill "$BACKEND_PID" "$CUSTOMER_PID" "$WORKBENCH_PID" 2>/dev/null || true
            }
            trap cleanup EXIT

            wait_for_url() {
              url="$1"
              for attempt in $(seq 1 90); do
                if curl --fail --silent --show-error "$url" > /dev/null; then
                  return 0
                fi
                sleep 1
              done
              echo "Timed out waiting for $url"
              return 1
            }

            wait_for_url http://127.0.0.1:8000/health
            wait_for_url http://127.0.0.1:8001/
            wait_for_url http://127.0.0.1:8002/workbench/

            node tests/browser/p12_3_claimant_workbench_recovery.cjs
            node tests/browser/pr975_claimant_profile.cjs
      - store_artifacts:
          path: browser-evidence
          destination: p12-browser-evidence

workflows:
  quality:
    jobs:
      - backend-quality
      - debug-ruff-format
      - debug-ruff-lint
      - debug-mypy
      - debug-format-worker
      - debug-format-repositories
      - debug-format-services
      - debug-format-tests
      - debug-format-fixture
      - debug-format-mongodb
      - debug-format-protocols
      - debug-format-incomplete
      - debug-format-retention-tests
      - debug-format-deployment-tests
      - debug-format-selector-tests
      - debug-format-selector
      - debug-mypy-worker
      - debug-mypy-repositories
      - debug-mypy-services
      - debug-mypy-tests
      - debug-autofix-format
      - github-automation-quality
      - pr-policy
      - docs-quality
      - customer-quality
      - workbench-quality
      - admin-quality
      - p12-browser-evidence
