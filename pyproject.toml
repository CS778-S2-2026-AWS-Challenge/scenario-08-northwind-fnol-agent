[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
# tests/fixtures holds data only; a test module placed there is never collected.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "fixtures"]
markers = [
    "integration: requires explicitly enabled external infrastructure",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/api/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Libraries used only by the controlled test corpus tools in tests/corpus/tools/. CI does
# not install them, so mypy treats them as untyped everywhere, locally and in CI alike.
module = ["reportlab.*", "pypdf.*", "pdfplumber.*"]
ignore_missing_imports = true
follow_imports = "skip"
